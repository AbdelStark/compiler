[package]
name = "arkade-compiler"
version = "0.1.0"
edition = "2021"
description = "A compiler for Arkade Script - a language for creating Bitcoin Taproot scripts"
authors = ["tiero"]
license = "MIT"

[dependencies]
pest = "2.7.8"
pest_derive = "2.7.8"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
clap = { version = "4.5.3", features = ["derive"] }
chrono = "0.4.34"

# WASM support (optional, for web playground)
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# STWO Cairo proof verification dependencies.
anyhow = "1.0.98"
cairo-air = { git = "https://github.com/software-mansion-labs/stwo-cairo.git", rev = "d8549be8c0a5f041c9f43cdb2064785ac0596902" }
starknet-ff = "0.3.7"
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "45d0180", default-features = false }

[features]
default = []
wasm = ["wasm-bindgen", "console_error_panic_hook"]

[lib]
name = "arkade_compiler"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
tempfile = "3.10.1"
assert_fs = "1.1.1"
predicates = "3.1.0"

[[bin]]
name = "arkadec"
path = "src/main.rs" 
